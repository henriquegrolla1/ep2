{% extends 'base.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}
<section>
    <h2>Entrar</h2>
    <form action="{% url 'login' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="acoes">
            <button class="botao" type="submit">Entrar</button>
        </div>
    </form>
    <p>Ainda não tem conta? <a href="{% url 'accounts:signup' %}">Cadastre-se</a></p>
</section>
{% endblock %}
