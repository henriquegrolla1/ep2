{% extends 'base.html' %}

{% block title %}Novo post{% endblock %}

{% block content %}
<section>
    <h2>Novo post</h2>
    <form action="{% url 'blog:create' %}" method="post">
        {% csrf_token %}
        <p>
            <label for="title">Título</label>
            <input type="text" name="title" id="title">
        </p>
        <p>
            <label for="date">Data de postagem</label>
            <input type="datetime-local" name="date" id="date">
        </p>
        <p>
            <label for="content">Conteúdo (HTML)</label>
            <textarea name="content" id="content"></textarea>
        </p>
        <div class="acoes">
            <button class="botao" type="submit">Publicar</button>
            <a class="botao" href="{% url 'blog:index' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
